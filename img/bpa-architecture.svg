<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do conversor BPA para o SUS</title>
  <desc id="description">O cliente autentica com Cognito, solicita uma URL pré-assinada pela API, envia o XLSX ao S3 e recebe o BPA convertido após processamento PHP acionado por evento. O status é consultado via polling.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3973c6"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d963e"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d27a35"/></marker>
    <style>
      .eyebrow { font: 700 13px 'Source Sans Pro', Arial, sans-serif; fill: #5d6965; letter-spacing: 1px; }
      .title { font: 700 19px 'Source Sans Pro', Arial, sans-serif; fill: #142321; }
      .copy { font: 400 14px 'Source Sans Pro', Arial, sans-serif; fill: #52605b; }
      .label { font: 700 13px 'Source Sans Pro', Arial, sans-serif; fill: #355b8c; }
      .band { font: 700 11px 'Source Sans Pro', Arial, sans-serif; fill: #fff; letter-spacing: .6px; }
    </style>
  </defs>
  <rect width="1240" height="650" fill="#fbfcf8"/>
  <text x="40" y="34" class="eyebrow">PIPELINE ASSÍNCRONO</text>
  <text x="1200" y="34" text-anchor="end" class="eyebrow">XLSX → BPA</text>
  <path d="M40 48H1200" stroke="#e3e8df"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M135 275V180" stroke="#3973c6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M230 335H310" stroke="#3973c6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M405 275V145H555" stroke="#3973c6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M555 110H500V225H210V275" stroke="#6d963e" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
    <path d="M230 405H520V385H555" stroke="#3973c6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M745 385H805" stroke="#d27a35" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M995 385H1045" stroke="#6d963e" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M405 405V475" stroke="#3973c6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M310 530H260V445H230" stroke="#6d963e" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
    <path d="M1120 455V595H135V445" stroke="#6d963e" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
  </g>

  <text x="239" y="318" class="label">Solicita URL</text>
  <text x="414" y="246" class="label">API protegida por JWT</text>
  <text x="335" y="213" class="label">URL pré-assinada</text>
  <text x="324" y="428" class="label">Upload XLSX direto ao S3</text>
  <text x="750" y="365" class="label">Evento S3</text>
  <text x="1000" y="365" class="label">BPA</text>
  <text x="416" y="461" class="label">Polling</text>
  <text x="520" y="582" class="label">Download com acesso temporário</text>

  <g>
    <rect x="40" y="275" width="190" height="170" rx="7" fill="#fff" stroke="#cbd8c8" stroke-width="2"/>
    <rect x="40" y="275" width="190" height="34" rx="7" fill="#315f47"/><path d="M40 301h190v8H40z" fill="#315f47"/>
    <text x="56" y="298" class="band">CLIENTE</text>
    <text x="58" y="343" class="title">Front-end</text>
    <text x="58" y="370" class="copy">Login · solicita upload</text>
    <text x="58" y="393" class="copy">Envia XLSX · consulta status</text>
    <text x="58" y="416" class="copy">Baixa o BPA convertido</text>
  </g>
  <g>
    <rect x="40" y="70" width="190" height="110" rx="7" fill="#e7f1df" stroke="#91b17a" stroke-width="2"/>
    <text x="58" y="101" class="eyebrow">IDENTIDADE</text>
    <text x="58" y="132" class="title">Amazon Cognito</text>
    <text x="58" y="157" class="copy">Autenticação · JWT</text>
  </g>
  <g>
    <rect x="310" y="275" width="190" height="130" rx="7" fill="#e8eef8" stroke="#9bb3d7" stroke-width="2"/>
    <rect x="310" y="275" width="190" height="34" rx="7" fill="#445c91"/><path d="M310 301h190v8H310z" fill="#445c91"/>
    <text x="326" y="298" class="band">ENTRADA DA API</text>
    <text x="328" y="347" class="title">API Gateway</text>
    <text x="328" y="375" class="copy">Rotas · valida JWT</text>
  </g>
  <g>
    <rect x="555" y="80" width="190" height="130" rx="7" fill="#fff0e2" stroke="#e4b27f" stroke-width="2"/>
    <rect x="555" y="80" width="190" height="34" rx="7" fill="#b76530"/><path d="M555 106h190v8H555z" fill="#b76530"/>
    <text x="571" y="103" class="band">URL SIGNER</text>
    <text x="573" y="152" class="title">AWS Lambda</text>
    <text x="573" y="180" class="copy">Gera URL temporária</text>
  </g>
  <g>
    <rect x="555" y="320" width="190" height="130" rx="7" fill="#e5f2ef" stroke="#8bb8ac" stroke-width="2"/>
    <rect x="555" y="320" width="190" height="34" rx="7" fill="#34766b"/><path d="M555 346h190v8H555z" fill="#34766b"/>
    <text x="571" y="343" class="band">BUCKET DE ENTRADA</text>
    <text x="573" y="392" class="title">Amazon S3</text>
    <text x="573" y="420" class="copy">Planilhas XLSX</text>
  </g>
  <g>
    <rect x="805" y="320" width="190" height="130" rx="7" fill="#fff0e2" stroke="#e4b27f" stroke-width="2"/>
    <rect x="805" y="320" width="190" height="34" rx="7" fill="#b76530"/><path d="M805 346h190v8H805z" fill="#b76530"/>
    <text x="821" y="343" class="band">PROCESSAMENTO</text>
    <text x="823" y="392" class="title">Script PHP</text>
    <text x="823" y="420" class="copy">Fargate ou Lambda custom</text>
  </g>
  <g>
    <rect x="1045" y="320" width="150" height="135" rx="7" fill="#e5f2ef" stroke="#8bb8ac" stroke-width="2"/>
    <rect x="1045" y="320" width="150" height="34" rx="7" fill="#34766b"/><path d="M1045 346h150v8h-150z" fill="#34766b"/>
    <text x="1061" y="343" class="band">BUCKET DE SAÍDA</text>
    <text x="1063" y="392" class="title">Amazon S3</text>
    <text x="1063" y="420" class="copy">Arquivo BPA</text>
  </g>
  <g>
    <rect x="310" y="475" width="190" height="110" rx="7" fill="#e8eef8" stroke="#9bb3d7" stroke-width="2"/>
    <rect x="310" y="475" width="190" height="34" rx="7" fill="#445c91"/><path d="M310 501h190v8H310z" fill="#445c91"/>
    <text x="326" y="498" class="band">CHECAGEM</text>
    <text x="328" y="547" class="title">AWS Lambda</text>
    <text x="328" y="572" class="copy">Responde ao polling</text>
  </g>
  <text x="40" y="628" class="eyebrow">IAM ROLES E POLÍTICAS LIMITAM O ACESSO ENTRE SERVIÇOS</text>
</svg>